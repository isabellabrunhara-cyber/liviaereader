<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minha Biblioteca</title>

    <!-- Biblioteca para leitura de EPUB -->
    <!-- JSZip precisa estar disponível para o epub.js quando carregamos a partir de Blob -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>

    <style>

        /* =========================
           CONFIGURAÇÕES GERAIS
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, "Times New Roman", serif;
            background: #f5f1eb;
            color: #2b2522;
        }


        /* =========================
           PÁGINA INICIAL
        ========================= */

        #home {
            min-height: 100vh;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        #home h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        #home p {
            font-size: 18px;
            color: #6d625c;
            margin-bottom: 40px;
        }


        /* =========================
           LIVROS
        ========================= */

        .books {
            display: flex;
            flex-wrap: wrap;

            justify-content: center;

            gap: 25px;

            width: 100%;
            max-width: 800px;
        }

        .book {
            width: 300px;

            background: white;

            border-radius: 15px;

            padding: 30px 20px;

            text-align: center;

            box-shadow: 0 5px 20px rgba(0,0,0,0.10);

            transition: transform 0.2s, box-shadow 0.2s;
        }

        .book:hover {
            transform: translateY(-5px);

            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .book-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .book h2 {
            font-size: 22px;
            margin-bottom: 20px;
        }

        .book button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #2b2522;
            color: white;

            font-family: Georgia, "Times New Roman", serif;

            font-size: 16px;

            cursor: pointer;

            transition: background 0.2s;
        }

        .book button:hover {
            background: #51443d;
        }


        /* =========================
           LEITOR
        ========================= */

        #reader {
            display: none;

            width: 100%;
            height: 100vh;
        }


        /* =========================
           CABEÇALHO DO LEITOR
        ========================= */

        header {
            height: 60px;

            background: #2b2522;
            color: white;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 20px;
        }

        #tituloLivro {
            font-size: 18px;

            text-align: center;

            flex: 1;

            margin: 0 15px;
        }


        /* =========================
           BOTÕES DO LEITOR
        ========================= */

        .reader-button {
            border: none;

            background: white;
            color: #2b2522;

            padding: 8px 14px;

            border-radius: 7px;

            cursor: pointer;

            font-family: Arial, sans-serif;

            font-size: 14px;
        }

        .reader-button:hover {
            background: #e8e2dc;
        }


        /* =========================
           ÁREA DO EPUB
        ========================= */

        #viewer {
            width: 100%;

            height: calc(100vh - 60px);

            background: white;
        }

        /* footer injected into pages */
        .epub-nav-footer {
            text-align: center;
            margin-top: 20px;
            padding: 10px 0;
            border-top: 1px solid #ddd;
        }

        .epub-nav-footer button {
            padding: 8px 12px;
            margin: 0 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background: #fff;
            cursor: pointer;
        }

        /* loader overlay */
        #loader-overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.45);
            z-index: 9999;
        }

        .loader-box {
            background: white;
            padding: 18px 22px;
            border-radius: 10px;
            text-align: center;
            min-width: 240px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }

        .loader-bar {
            width: 100%;
            height: 10px;
            background: #eee;
            margin-top: 12px;
            border-radius: 6px;
            overflow: hidden;
        }

        .loader-progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg,#6b8cff,#2b2522);
            transition: width 150ms linear;
        }

        #loader-text { font-size: 14px; color:#222; }


        /* =========================
           CELULAR
        ========================= */

        @media (max-width: 600px) {

            #home h1 {
                font-size: 32px;
            }

            #home p {
                font-size: 16px;
            }

            .book {
                width: 100%;
                max-width: 330px;
            }

            header {
                padding: 0 10px;
            }

            #tituloLivro {
                font-size: 14px;
            }

            .reader-button {
                padding: 7px 9px;
                font-size: 12px;
            }
        }

    </style>
</head>


<body>


    <!-- =====================================================
         PÁGINA INICIAL
    ====================================================== -->

    <div id="home">

        <h1>📚 Minha Biblioteca</h1>

        <p>Escolha um livro para começar a leitura</p>


        <div class="books">


            <!-- =========================
                 LIVRO 1
            ========================== -->

            <div class="book">

                <div class="book-icon">
                    🌙
                </div>

                <h2>
                    Despertar da Lua Caída
                </h2>

                <button
                    onclick="abrirLivro(
                        'despertar-da-lua-caida.epub',
                        'Despertar da Lua Caída'
                    )">

                    📖 Ler livro

                </button>

            </div>



            <!-- =========================
                 LIVRO 2
            ========================== -->

            <div class="book">

                <div class="book-icon">
                    🩸
                </div>

                <h2>
                    Sangue Sobre Bright Haven
                </h2>

                <button
                    onclick="abrirLivro(
                        'sangue-sobre-bright-haven.epub',
                        'Sangue Sobre Bright Haven'
                    )">

                    📖 Ler livro

                </button>

            </div>


        </div>

    </div>



    <!-- =====================================================
         LEITOR
    ====================================================== -->

    <div id="reader">


        <!-- CABEÇALHO -->

        <header>

            <button
                class="reader-button nav-button"
                onclick="voltarInicio()">

                ← Biblioteca

            </button>


            <span id="tituloLivro">
                Carregando...
