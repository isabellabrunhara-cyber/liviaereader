<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minha Biblioteca</title>

    <style>

        /* =========================
           CONFIGURAÇÕES GERAIS
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, "Times New Roman", serif;
            background: #f5f1eb;
            color: #2b2522;
        }


        /* =========================
           PÁGINA INICIAL
        ========================= */

        #home {
            min-height: 100vh;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        #home h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        #home p {
            font-size: 18px;
            color: #6d625c;
            margin-bottom: 40px;
        }


        /* =========================
           LIVROS
        ========================= */

        .books {
            display: flex;
            flex-wrap: wrap;

            justify-content: center;

            gap: 25px;

            width: 100%;
            max-width: 800px;
        }

        .book {
            width: 300px;

            background: white;

            border-radius: 15px;

            padding: 30px 20px;

            text-align: center;

            box-shadow: 0 5px 20px rgba(0,0,0,0.10);

            transition: transform 0.2s, box-shadow 0.2s;
        }

        .book:hover {
            transform: translateY(-5px);

            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .book-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .book h2 {
            font-size: 22px;
            margin-bottom: 20px;
        }

        .book button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #2b2522;
            color: white;

            font-family: Georgia, "Times New Roman", serif;

            font-size: 16px;

            cursor: pointer;

            transition: background 0.2s;
        }

        .book button:hover {
            background: #51443d;
        }


        /* =========================
           LEITOR
        ========================= */

        #reader {
            display: none;

            width: 100%;
            height: 100vh;
        }


        /* =========================
           CABEÇALHO DO LEITOR
        ========================= */

        header {
            height: 60px;

            background: #2b2522;
            color: white;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 20px;
        }

        #tituloLivro {
            font-size: 18px;

            text-align: center;

            flex: 1;

            margin: 0 15px;
        }


        /* =========================
           BOTÕES DO LEITOR
        ========================= */

        .reader-button {
            border: none;

            background: white;
            color: #2b2522;

            padding: 8px 14px;

            border-radius: 7px;

            cursor: pointer;

            font-family: Arial, sans-serif;

            font-size: 14px;
        }

        .reader-button:hover {
            background: #e8e2dc;
        }


        /* =========================
           ÁREA DO PDF
        ========================= */

        #viewer {
            width: 100%;

            height: calc(100vh - 60px);

            background: white;
        }

        /* loader overlay */
        #loader-overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.45);
            z-index: 9999;
        }

        .loader-box {
            background: white;
            padding: 18px 22px;
            border-radius: 10px;
            text-align: center;
            min-width: 240px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }

        .loader-bar {
            width: 100%;
            height: 10px;
            background: #eee;
            margin-top: 12px;
            border-radius: 6px;
            overflow: hidden;
        }

        .loader-progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg,#6b8cff,#2b2522);
            transition: width 150ms linear;
        }

        #loader-text { font-size: 14px; color:#222; }


        /* =========================
           CELULAR
        ========================= */

        @media (max-width: 600px) {

            #home h1 {
                font-size: 32px;
            }

            #home p {
                font-size: 16px;
            }

            .book {
                width: 100%;
                max-width: 330px;
            }

            header {
                padding: 0 10px;
            }

            #tituloLivro {
                font-size: 14px;
            }

            .reader-button {
                padding: 7px 9px;
                font-size: 12px;
            }
        }

    </style>
</head>


<body>


    <!-- =====================================================
         PÁGINA INICIAL
    ====================================================== -->

    <div id="home">

        <h1>📚 Minha Biblioteca</h1>

        <p>Escolha um livro para começar a leitura</p>


        <div class="books">


            <!-- =========================
                 LIVRO 1
            ========================== -->

            <div class="book">

                <div class="book-icon">
                    🌙
                </div>

                <h2>
                    Despertar da Lua Caída
                </h2>

                <button
                    onclick="abrirLivro(
                        'despertar-da-lua-caida.pdf',
                        'Despertar da Lua Caída'
                    )">

                    📖 Ler livro

                </button>

            </div>



            <!-- =========================
                 LIVRO 2
            ========================== -->

            <div class="book">

                <div class="book-icon">
                    🩸
                </div>

                <h2>
                    Sangue Sobre Bright Haven
                </h2>

                <button
                    onclick="abrirLivro(
                        'sangue-sobre-bright-haven.pdf',
                        'Sangue Sobre Bright Haven'
                    )">

                    📖 Ler livro

                </button>

            </div>


        </div>

    </div>



    <!-- =====================================================
         LEITOR
    ====================================================== -->

    <div id="reader">


        <!-- CABEÇALHO -->

        <header>

            <button
                class="reader-button nav-button"
                onclick="voltarInicio()">

                ← Biblioteca

            </button>


            <span id="tituloLivro">
                Carregando...
            </span>


            <div>

                <button
                    class="reader-button nav-button"
                    id="btn-prev"
                    style="display:none">

                    ←

                </button>


                <button
                    class="reader-button nav-button"
                    id="btn-next"
                    style="display:none">

                    →

                </button>

            </div>

        </header>



        <!-- ÁREA ONDE O PDF SERÁ RENDERIZADO -->

        <div id="viewer"></div>

        <!-- Loader overlay -->
        <div id="loader-overlay" aria-hidden="true">
            <div class="loader-box">
                <div id="loader-text">Carregando...</div>
                <div class="loader-bar">
                    <div id="loader-progress" class="loader-progress" style="width:0%"></div>
                </div>
            </div>
        </div>

    </div>



    <script>

        /* =====================================================
           VARIÁVEIS
        ====================================================== */

        // URL base do GitHub Pages - usar relativa para maior compatibilidade
        const BASE_URL = './';

        function setNavEnabled(enabled) {
            document.querySelectorAll('.nav-button').forEach(b => {
                b.disabled = !enabled;
                if (enabled) b.style.opacity = '1'; else b.style.opacity = '0.6';
            });
        }

        function showLoader(show) {
            const el = document.getElementById('loader-overlay');
            if (!el) return;
            el.style.display = show ? 'flex' : 'none';
        }

        function updateLoaderProgress(percent, text) {
            const pctEl = document.getElementById('loader-progress');
            const textEl = document.getElementById('loader-text');
            if (pctEl) {
                if (typeof percent === 'number') {
                    pctEl.style.width = percent + '%';
                } else {
                    pctEl.style.width = '40%';
                }
            }
            if (textEl && text) textEl.textContent = text;
        }

        /* =====================================================
           ABRIR PDF (simples via iframe)
        ====================================================== */

        async function abrirLivro(arquivo, titulo) {

            showLoader(true);
            updateLoaderProgress(0, 'Iniciando download...');

            setNavEnabled(false);

            // Esconde a página inicial e mostra o leitor
            document.getElementById("home").style.display = "none";
            document.getElementById("reader").style.display = "block";
            document.getElementById("tituloLivro").textContent = titulo;
            document.getElementById("viewer").innerHTML = "";

            const epubUrl = BASE_URL + arquivo;

            try {
                const resp = await fetch(epubUrl);
                if (!resp.ok) throw new Error('HTTP ' + resp.status);

                const contentLength = resp.headers.get('Content-Length');
                const total = contentLength ? parseInt(contentLength, 10) : null;

                // tenta fazer streaming para progresso quando possível
                if (!resp.body || !resp.body.getReader) {
                    updateLoaderProgress(null, 'Baixando arquivo...');
                    const blob = await resp.blob();

                    // validação simples
                    if (blob.size < 2048) {
                        showLoader(false);
                        alert('Arquivo PDF inválido (tamanho muito pequeno). Verifique o arquivo no repositório.');
                        voltarInicio();
                        return;
                    }

                    const url = URL.createObjectURL(blob);
                    const iframe = document.createElement('iframe');
                    iframe.src = url;
                    iframe.style.width = '100%';
                    iframe.style.height = '100%';
                    iframe.style.border = '0';
                    document.getElementById('viewer').appendChild(iframe);
                    window._currentPdfUrl = url;

                    updateLoaderProgress(100, 'Concluído — abrindo...');
                    showLoader(false);
                    setNavEnabled(true);
                    localStorage.setItem("ultimoLivro", arquivo);
                    localStorage.setItem("ultimoTitulo", titulo);
                    return;
                }

                // streaming reader path
                const reader = resp.body.getReader();
                const chunks = [];
                let received = 0;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    chunks.push(value);
                    received += value.length || value.byteLength || 0;

                    if (total) {
                        const percent = Math.round((received / total) * 100);
                        updateLoaderProgress(percent, `Baixando... ${percent}%`);
                    } else {
                        updateLoaderProgress(null, `Baixando... ${Math.round(received/1024)} KB`);
                    }
                }

                const blob = new Blob(chunks, { type: 'application/pdf' });

                if (blob.size < 2048) {
                    showLoader(false);
                    alert('Arquivo PDF inválido (tamanho muito pequeno). Verifique o arquivo no repositório.');
                    voltarInicio();
                    return;
                }

                const url = URL.createObjectURL(blob);
                const iframe = document.createElement('iframe');
                iframe.src = url;
                iframe.style.width = '100%';
                iframe.style.height = '100%';
                iframe.style.border = '0';
                document.getElementById('viewer').appendChild(iframe);
                window._currentPdfUrl = url;

                updateLoaderProgress(100, 'Concluído — abrindo...');
                showLoader(false);
                setNavEnabled(true);
                localStorage.setItem("ultimoLivro", arquivo);
                localStorage.setItem("ultimoTitulo", titulo);

            } catch (e) {
                console.error('Erro carregando PDF', e);
                showLoader(false);
                alert('Erro ao carregar o arquivo: ' + (e && e.message ? e.message : e));
                voltarInicio();
            }

        }

        /* =====================================================
           VOLTAR PARA A BIBLIOTECA
        ====================================================== */

        function voltarInicio() {
            setNavEnabled(false);

            // Revoke object URL se existir
            try {
                if (window._currentPdfUrl) {
                    URL.revokeObjectURL(window._currentPdfUrl);
                    window._currentPdfUrl = null;
                }
            } catch (e) { console.warn('revoke failed', e); }

            // Esconde o leitor
            document.getElementById("reader").style.display = "none";

            // Mostra a biblioteca
            document.getElementById("home").style.display = "flex";

            // Limpa o viewer
            document.getElementById("viewer").innerHTML = "";
        }

        /* =====================================================
           TECLADO (scroll simples no viewer)
        ====================================================== */

        document.addEventListener("keydown", function(event) {
            // Apenas se o leitor estiver visível
            if (document.getElementById('reader').style.display === 'none') return;

            const viewer = document.getElementById('viewer');
            if (!viewer) return;

            if (event.key === "ArrowRight" || event.key === 'PageDown') {
                viewer.scrollBy({ left: viewer.clientWidth * 0.8, behavior: 'smooth' });
            }
            if (event.key === "ArrowLeft" || event.key === 'PageUp') {
                viewer.scrollBy({ left: -viewer.clientWidth * 0.8, behavior: 'smooth' });
            }
        });

        // expõe função global (para onclick inline)
        window.abrirLivro = abrirLivro;
        window.voltarInicio = voltarInicio;

    </script>


</body>

</html>
