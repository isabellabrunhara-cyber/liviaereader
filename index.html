<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minha Biblioteca</title>

    <!-- Biblioteca para leitura de EPUB -->
    <!-- JSZip precisa estar disponível para o epub.js quando carregamos a partir de Blob -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>

    <style>

        /* =========================
           CONFIGURAÇÕES GERAIS
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, "Times New Roman", serif;
            background: #f5f1eb;
            color: #2b2522;
        }


        /* =========================
           PÁGINA INICIAL
        ========================= */

        #home {
            min-height: 100vh;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        #home h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        #home p {
            font-size: 18px;
            color: #6d625c;
            margin-bottom: 40px;
        }


        /* =========================
           LIVROS
        ========================= */

        .books {
            display: flex;
            flex-wrap: wrap;

            justify-content: center;

            gap: 25px;

            width: 100%;
            max-width: 800px;
        }

        .book {
            width: 300px;

            background: white;

            border-radius: 15px;

            padding: 30px 20px;

            text-align: center;

            box-shadow: 0 5px 20px rgba(0,0,0,0.10);

            transition: transform 0.2s, box-shadow 0.2s;
        }

        .book:hover {
            transform: translateY(-5px);

            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .book-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .book h2 {
            font-size: 22px;
            margin-bottom: 20px;
        }

        .book button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #2b2522;
            color: white;

            font-family: Georgia, "Times New Roman", serif;

            font-size: 16px;

            cursor: pointer;

            transition: background 0.2s;
        }

        .book button:hover {
            background: #51443d;
        }


        /* =========================
           LEITOR
        ========================= */

        #reader {
            display: none;

            width: 100%;
            height: 100vh;
        }


        /* =========================
           CABEÇALHO DO LEITOR
        ========================= */

        header {
            height: 60px;

            background: #2b2522;
            color: white;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 20px;
        }

        #tituloLivro {
            font-size: 18px;

            text-align: center;

            flex: 1;

            margin: 0 15px;
        }


        /* =========================
           BOTÕES DO LEITOR
        ========================= */

        .reader-button {
            border: none;

            background: white;
            color: #2b2522;

            padding: 8px 14px;

            border-radius: 7px;

            cursor: pointer;

            font-family: Arial, sans-serif;

            font-size: 14px;
        }

        .reader-button:hover {
            background: #e8e2dc;
        }


        /* =========================
           ÁREA DO EPUB
        ========================= */

        #viewer {
            width: 100%;

            height: calc(100vh - 60px);

            background: white;
        }

        /* footer injected into pages */
        .epub-nav-footer {
            text-align: center;
            margin-top: 20px;
            padding: 10px 0;
            border-top: 1px solid #ddd;
        }

        .epub-nav-footer button {
            padding: 8px 12px;
            margin: 0 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background: #fff;
            cursor: pointer;
        }

        /* loader overlay */
        #loader-overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.45);
            z-index: 9999;
        }

        .loader-box {
            background: white;
            padding: 18px 22px;
            border-radius: 10px;
            text-align: center;
            min-width: 240px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }

        .loader-bar {
            width: 100%;
            height: 10px;
            background: #eee;
            margin-top: 12px;
            border-radius: 6px;
            overflow: hidden;
        }

        .loader-progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg,#6b8cff,#2b2522);
            transition: width 150ms linear;
        }

        #loader-text { font-size: 14px; color:#222; }


        /* =========================
           CELULAR
        ========================= */

        @media (max-width: 600px) {

            #home h1 {
                font-size: 32px;
            }

            #home p {
                font-size: 16px;
            }

            .book {
                width: 100%;
                max-width: 330px;
            }

            header {
                padding: 0 10px;
            }

            #tituloLivro {
                font-size: 14px;
            }

            .reader-button {
                padding: 7px 9px;
                font-size: 12px;
            }
        }

    </style>
</head>


<body>


    <!-- =====================================================
         PÁGINA INICIAL
    ====================================================== -->

    <div id="home">

        <h1>📚 Minha Biblioteca</h1>

        <p>Escolha um livro para começar a leitura</p>


        <div class="books">


            <!-- =========================
                 LIVRO 1
            ========================== -->

            <div class="book">

                <div class="book-icon">
                    🌙
                </div>

                <h2>
                    Despertar da Lua Caída
                </h2>

                <button
                    onclick="abrirLivro(
                        'despertar-da-lua-caida.epub',
                        'Despertar da Lua Caída'
                    )">

                    📖 Ler livro

                </button>

            </div>



            <!-- =========================
                 LIVRO 2
            ========================== -->

            <div class="book">

                <div class="book-icon">
                    🩸
                </div>

                <h2>
                    Sangue Sobre Bright Haven
                </h2>

                <button
                    onclick="abrirLivro(
                        'sangue-sobre-bright-haven.epub',
                        'Sangue Sobre Bright Haven'
                    )">

                    📖 Ler livro

                </button>

            </div>


        </div>

    </div>



    <!-- =====================================================
         LEITOR
    ====================================================== -->

    <div id="reader">


        <!-- CABEÇALHO -->

        <header>

            <button
                class="reader-button nav-button"
                onclick="voltarInicio()">

                ← Biblioteca

            </button>


            <span id="tituloLivro">
                Carregando...
            </span>


            <div>

                <button
                    class="reader-button nav-button"
                    id="btn-prev"
                    onclick="livroAnterior()">

                    ←

                </button>


                <button
                    class="reader-button nav-button"
                    id="btn-next"
                    onclick="proximoLivro()">

                    →

                </button>

            </div>

        </header>



        <!-- ÁREA ONDE O EPUB SERÁ RENDERIZADO -->

        <div id="viewer"></div>

        <!-- Loader overlay -->
        <div id="loader-overlay" aria-hidden="true">
            <div class="loader-box">
                <div id="loader-text">Carregando...</div>
                <div class="loader-bar">
                    <div id="loader-progress" class="loader-progress" style="width:0%"></div>
                </div>
            </div>
        </div>

    </div>



    <script>


        /* =====================================================
           VARIÁVEIS
        ====================================================== */

        let book = null;

        let rendition = null;

        let isReady = false; // só true depois do rendition.display() completar

        // URL base do GitHub Pages - usar relativa para maior compatibilidade
        const BASE_URL = './';

        // utilitários para habilitar/desabilitar botões de navegação
        function setNavEnabled(enabled) {
            document.querySelectorAll('.nav-button').forEach(b => {
                b.disabled = !enabled;
                if (enabled) b.style.opacity = '1'; else b.style.opacity = '0.6';
            });
        }

        function showLoader(show) {
            const el = document.getElementById('loader-overlay');
            if (!el) return;
            el.style.display = show ? 'flex' : 'none';
        }

        function updateLoaderProgress(percent, text) {
            const pctEl = document.getElementById('loader-progress');
            const textEl = document.getElementById('loader-text');
            if (pctEl) {
                if (typeof percent === 'number') {
                    pctEl.style.width = percent + '%';
                } else {
                    pctEl.style.width = '40%';
                }
            }
            if (textEl && text) textEl.textContent = text;
        }


        /* =====================================================
           ABRIR LIVRO (com download stream + loader)
        ====================================================== */

        async function abrirLivro(arquivo, titulo) {

            showLoader(true);
            updateLoaderProgress(0, 'Iniciando download...');

            isReady = false;
            setNavEnabled(false);

            /*
             * Esconde a página inicial
             */

            document.getElementById("home").style.display = "none";


            /*
             * Mostra o leitor
             */

            document.getElementById("reader").style.display = "block";


            /*
             * Coloca o título no cabeçalho
             */

            document.getElementById("tituloLivro").textContent = titulo;


            /*
             * Limpa o leitor anterior
             */

            document.getElementById("viewer").innerHTML = "";


            /*
             * Cria o EPUB com URL absoluta
             */

            const epubUrl = BASE_URL + arquivo;

            try {
                const resp = await fetch(epubUrl);
                if (!resp.ok) throw new Error('HTTP ' + resp.status);

                const contentLength = resp.headers.get('Content-Length');
                const total = contentLength ? parseInt(contentLength, 10) : null;

                // se não houver streaming, pega o blob direto
                if (!resp.body || !resp.body.getReader) {
                    updateLoaderProgress(null, 'Baixando arquivo...');
                    const blob = await resp.blob();
                    updateLoaderProgress(100, 'Concluído — abrindo...');
                    await openBlobAsEpub(blob, arquivo, titulo);
                    return;
                }

                const reader = resp.body.getReader();
                const chunks = [];
                let received = 0;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    chunks.push(value);
                    received += value.length || value.byteLength || 0;

                    if (total) {
                        const percent = Math.round((received / total) * 100);
                        updateLoaderProgress(percent, `Baixando... ${percent}%`);
                    } else {
                        updateLoaderProgress(null, `Baixando... ${Math.round(received/1024)} KB`);
                    }
                }

                const blob = new Blob(chunks, { type: 'application/epub+zip' });
                updateLoaderProgress(100, 'Concluído — abrindo...');

                await openBlobAsEpub(blob, arquivo, titulo);

            } catch (e) {
                console.error('Erro carregando EPUB', e);
                alert('Erro ao carregar o livro: ' + e.message);
                voltarInicio();
            } finally {
                showLoader(false);
            }

        }

        async function openBlobAsEpub(blob, arquivo, titulo) {
            // converte Blob -> ArrayBuffer para evitar erros de compatibilidade do epub.js/JSZip
            const arrayBuffer = await blob.arrayBuffer();

            // carrega o epub a partir do ArrayBuffer
            book = ePub(arrayBuffer);

            // logging para debug
            book.loaded.metadata
                .then(m => console.log('metadata', m))
                .catch(e => console.error('metadata error', e));
            book.ready
                .then(() => console.log('book.ready OK'))
                .catch(e => console.error('book.ready error', e));

            // Renderiza o livro
            rendition = book.renderTo("viewer", {
                width: "100%",
                height: "100%",
                spread: "auto"
            });

            // Quando uma página for renderizada, injetamos botões no final dela
            rendition.on('rendered', function (section) {
                try {
                    const contents = rendition.getContents();
                    if (!contents || !contents.document) return;
                    const doc = contents.document;

                    // evita duplicar o footer
                    if (doc.getElementById('epub-nav-footer')) return;

                    const footer = doc.createElement('div');
                    footer.id = 'epub-nav-footer';
                    footer.className = 'epub-nav-footer';

                    const btnPrev = doc.createElement('button');
                    btnPrev.textContent = '← Anterior';
                    btnPrev.style.marginRight = '12px';

                    const btnNext = doc.createElement('button');
                    btnNext.textContent = 'Próxima →';

                    footer.appendChild(btnPrev);
                    footer.appendChild(btnNext);

                    doc.body.appendChild(footer);

                    // anexa handlers que chamam o rendition do host
                    btnPrev.addEventListener('click', function (e) {
                        try { rendition.prev(); } catch (err) { console.error('prev in page error', err); }
                    });

                    btnNext.addEventListener('click', function (e) {
                        try { rendition.next(); } catch (err) { console.error('next in page error', err); }
                    });

                } catch (err) {
                    console.error('error injecting footer', err);
                }
            });

            // Mostra a primeira página
            await rendition.display();

            isReady = true;
            setNavEnabled(true);
            console.log('rendition ready');

            localStorage.setItem("ultimoLivro", arquivo);
            localStorage.setItem("ultimoTitulo", titulo);
        }


        /* =====================================================
           PRÓXIMA PÁGINA
        ====================================================== */

        function proximoLivro() {

            if (!isReady || !rendition) return;

            try {
                rendition.next();
            } catch (e) {
                console.error('next error', e);
            }

        }


        /* =====================================================
           PÁGINA ANTERIOR
        ====================================================== */

        function livroAnterior() {

            if (!isReady || !rendition) return;

            try {
                rendition.prev();
            } catch (e) {
                console.error('prev error', e);
            }

        }


        /* =====================================================
           VOLTAR PARA A BIBLIOTECA
        ====================================================== */

        function voltarInicio() {

            isReady = false;
            setNavEnabled(false);

            /*
             * Esconde o leitor
             */

            document.getElementById("reader").style.display = "none";


            /*
             * Mostra a biblioteca
             */

            document.getElementById("home").style.display = "flex";


            /*
             * Remove o EPUB da tela
             */

            document.getElementById("viewer").innerHTML = "";

            book = null;

            rendition = null;

        }


        /* =====================================================
           TECLADO
        ====================================================== */

        document.addEventListener("keydown", function (event) {

            /*
             * Se nenhum livro estiver aberto ou não estiver pronto, não faz nada
             */

            if (!isReady) {
                return;
            }


            /*
             * Seta direita = próxima página
             */

            if (event.key === "ArrowRight") {

                try { rendition.next(); } catch (e) { console.error('next error', e); }

            }


            /*
             * Seta esquerda = página anterior
             */

            if (event.key === "ArrowLeft") {

                try { rendition.prev(); } catch (e) { console.error('prev error', e); }

            }

        });

        // expõe funções no escopo global para handlers inline
        window.abrirLivro = abrirLivro;
        window.proximoLivro = proximoLivro;
        window.livroAnterior = livroAnterior;
        window.voltarInicio = voltarInicio;

    </script>


</body>

</html>
